name: Publish kumo-connectrpc-kit to JSR

on:
  push:
    branches: [main]
    paths: ["packages/kumo-connectrpc-kit/**"]

permissions:
  contents: read
  id-token: write # JSR OIDC (tokenless) — needs the JSR package linked to THIS repo

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kumo-connectrpc-kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.15
          cache: true
      - run: pnpm install
      - run: pnpm run typecheck # gate: a broken kit can't publish
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm dlx jsr publish
